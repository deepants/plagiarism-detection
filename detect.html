<!DOCTYPE html>
<html>
<head>
    <title>Real-Time AI Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>
    <h1><i class="fa-solid fa-microchip"></i> Real-Time AI Detection</h1>
    <nav>
        <a href="/">How It Works</a>
        <a href="/detect">Real-Time Detection</a>
    </nav>
</header>

<div class="container">

    <form method="POST" class="card">
        <textarea name="text" rows="10" placeholder="Enter text here..."></textarea>
        <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i> Analyze
        </button>
    </form>

    {% if result %}
    <div class="result-card">
        <h3><i class="fa-solid fa-chart-pie"></i> Detection Result</h3>
        <p><strong>Label:</strong> {{ result.label }}</p>
        <p><strong>Probability:</strong> {{ result.probability }} %</p>
        <p><strong>Reason:</strong> {{ result.reason }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
